[versions]
kotlin = "2.2.21"
mosaic = "1.1.0"
coroutines = "1.11.0"
junit = "5.12.2"
spring = "6.2.19"
spring-boot = "3.5.16"
micronaut = "4.9.3"

[libraries]
mosaic-core = { module = "org.buildmosaic:mosaic-core", version.ref = "mosaic" }
coroutines-core = { module = "org.jetbrains.kotlinx:kotlinx-coroutines-core", version.ref = "coroutines" }
kotlin-test-junit5 = { module = "org.jetbrains.kotlin:kotlin-test-junit5", version.ref = "kotlin" }
junit-bom = { module = "org.junit:junit-bom", version.ref = "junit" }
junit-jupiter-engine = { module = "org.junit.jupiter:junit-jupiter-engine" }
junit-platform-launcher = { module = "org.junit.platform:junit-platform-launcher" }

spring-beans = { module = "org.springframework:spring-beans", version.ref = "spring" }
spring-context = { module = "org.springframework:spring-context", version.ref = "spring" }
spring-web = { module = "org.springframework:spring-web", version.ref = "spring" }
spring-test = { module = "org.springframework:spring-test", version.ref = "spring" }
jakarta-servlet = { module = "jakarta.servlet:jakarta.servlet-api", version = "6.0.0" }

spring-boot-autoconfigure = { module = "org.springframework.boot:spring-boot-autoconfigure", version.ref = "spring-boot" }

micronaut-context = { module = "io.micronaut:micronaut-context", version.ref = "micronaut" }
micronaut-http-server = { module = "io.micronaut:micronaut-http-server", version.ref = "micronaut" }
micronaut-inject-java = { module = "io.micronaut:micronaut-inject-java", version.ref = "micronaut" }
slf4j-simple = { module = "org.slf4j:slf4j-simple", version = "2.0.17" }

[plugins]
kotlin-jvm = { id = "org.jetbrains.kotlin.jvm", version.ref = "kotlin" }
